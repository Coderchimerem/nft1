<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
      @theme {
     --color-Blue-500: hsl(215, 51%, 70%);
     --color-Cyan-400: hsl(178, 100%, 50%);
     --color-Blue-950: hsl(217, 54%, 11%);
     --color-Blue-900: hsl(216, 50%, 16%);
     --color-Blue-800: hsl(215, 32%, 27%);
     --color-White: hsl(0, 0%, 100%);
     --font-Outfit: 'Outfit', sans-serif;
      }
</style>
</head>
<body class="bg-Blue-950 flex items-center justify-center w-full min-h-screen font-Outfit">
    <main>
        <div class="bg-Blue-900 p-6 m-10 rounded-xl lg:mx-auto lg:w-1/2" id="card">
        <img src="./images/image-equilibrium.jpg" alt="">
        <h2 class="text-White text-xl my-5">Equilibrium #3429</h2>
            <p class="text-Blue-500">Our Equilibrium collection promotes balance and calm.</p>

            <div class="flex justify-between items-center py-4">
                <div class="flex gap-2">
                    <img src="./images/icon-ethereum.svg" alt="Ethereum">
                    <p class="text-Cyan-400">0.041 ETH</p>
                </div>
                <div class="flex gap-2">
                    <img src="./images/icon-clock.svg" alt="Clock">
                    <p class="text-Blue-500">3 days left</p>
                </div>
            </div>
            <hr class="border-Blue-800 py-2">
            <div class="flex items-center py-1 gap-3">
                <img class="w-10 h-10 rounded-full border-1 border-White mr-3" src="./images/image-avatar.png" alt="">
                <h3 class="text-Blue-500">Creation of <span class="text-white text-sm">Jules Wyvern</span></h3>
            </div>
        </div>
    </main>
    
</body>
</html>
